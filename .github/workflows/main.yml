name: Build CSMoE APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install SDK/NDK first (sdkmanager uses the runner's default Java)
      - name: Install Android SDK, NDK r20, CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;20.1.5948944" \
            "cmake;3.18.1"

      # Old Gradle/AGP versions usually need JDK 8-11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build debug APK
        working-directory: Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/20.1.5948944
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CSMoE-apk
          path: Android/app/build/outputs/apk/**/*.apk
