name: Build CSMoE APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Fix 1: CMake asks for "sdl2" but the folder is "SDL2" (Linux is case-sensitive)
      - name: Fix SDL2 folder name
        run: ln -s SDL2 3rdparty/sdl2

      # Fix 2: boost 1.77.0 is not a submodule, it must be downloaded
      - name: Download Boost 1.77.0
        run: |
          curl -fL -o boost.tar.gz https://archives.boost.io/release/1.77.0/source/boost_1_77_0.tar.gz
          tar xzf boost.tar.gz -C 3rdparty
          ls 3rdparty/boost_1_77_0/boost/version.hpp

      # Same extra step the project's own CI (.travis.yml) does for Android
      - name: Clone LuaJIT
        run: git clone --depth 1 https://github.com/LuaJIT/LuaJIT 3rdparty/LuaJIT

      - name: Install Android SDK, NDK r20, CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;20.1.5948944" \
            "cmake;3.18.1"
          # Fix 3: set NDK path at runtime (the old version used an empty variable)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/20.1.5948944" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Build debug APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CSMoE-apk
          path: Android/app/build/outputs/apk/**/*.apk
